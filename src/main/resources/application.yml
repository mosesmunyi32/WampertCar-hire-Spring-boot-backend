spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: wampert

  mongodb:
    uri: ${WAMPERT_MONGODB_URI}


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true



server:
  port: 9020


app:
  security:
    default-password: ${DEFAULT_PASSWORD:12345678}


jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

Cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}


logging:
  level:
    root: INFO
    com:
      wampert: DEBUG
    org:
      springframework:
        data:
          mongodb: DEBUG

kind: Application


twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  whatsapp-number: +14155238886
  admin-whatsapp-number: "+25470750362"

booking:
  pending-expiry-minutes: 10
  expiry-check-interval-ms: 60000

file:
  upload:
    dir: /var/www/sites/wampertcar/uploads
  base:
    url: https://api.warmpertcar.site/uploads
